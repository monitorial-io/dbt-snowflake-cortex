name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DBT_VERSION: "1.9"
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SQLFluff
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-snowflake~=${{ env.DBT_VERSION }}

      - name: Lint macros
        run: sqlfluff lint macros/ --dialect snowflake || true

  compile:
    name: Compile & Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake~=${{ env.DBT_VERSION }}

      - name: Create placeholder private key file
        run: touch /tmp/snowflake_key.p8

      - name: Install dbt dependencies
        working-directory: integration_tests
        run: dbt deps

      - name: Parse project (validates YML and macro syntax)
        working-directory: integration_tests
        run: dbt parse --profiles-dir .

      - name: Compile project
        working-directory: integration_tests
        run: dbt compile --profiles-dir .

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: compile
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Write private key file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake~=${{ env.DBT_VERSION }}

      - name: Install dbt dependencies
        working-directory: integration_tests
        run: dbt deps

      - name: Run singular tests
        working-directory: integration_tests
        run: dbt test --profiles-dir .
