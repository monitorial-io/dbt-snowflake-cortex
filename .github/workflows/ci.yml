name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/integration_tests

jobs:
  compile:
    name: Compile, Parse & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake and SQLFluff
        run: pip install dbt-snowflake>=1.9.4 sqlfluff sqlfluff-templater-dbt

      - name: Create placeholder private key file
        run: openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out /tmp/rsa_key.p8

      - name: Create dbt profiles.yml
        run: |
          {
            echo "integration_tests:"
            echo "  target: ci"
            echo "  outputs:"
            echo "    ci:"
            echo "      type: snowflake"
            echo "      account: dummy"
            echo "      user: dummy"
            echo "      authenticator: snowflake_jwt"
            echo "      private_key_path: /tmp/rsa_key.p8"
            echo "      role: dummy"
            echo "      warehouse: dummy"
            echo "      database: dummy"
            echo "      schema: dummy"
            echo "      threads: 4"
          } > integration_tests/profiles.yml

      - name: Install dbt dependencies
        working-directory: integration_tests
        run: dbt deps

      - name: Parse project (validates YML and macro syntax)
        working-directory: integration_tests
        run: dbt parse

      - name: Compile project
        working-directory: integration_tests
        run: dbt compile

      - name: Lint macros
        run: sqlfluff lint macros/ --dialect snowflake || true

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: compile
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake>=1.9.4

      - name: Write private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Create dbt profiles.yml
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          {
            echo "integration_tests:"
            echo "  target: ci"
            echo "  outputs:"
            echo "    ci:"
            echo "      type: snowflake"
            echo "      account: \"${SNOWFLAKE_ACCOUNT}\""
            echo "      user: \"${SNOWFLAKE_USER}\""
            echo "      authenticator: snowflake_jwt"
            echo "      private_key_path: /tmp/rsa_key.p8"
            if [ -n "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" ]; then
              echo "      private_key_passphrase: \"${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}\""
            fi
            echo "      role: \"${SNOWFLAKE_ROLE}\""
            echo "      warehouse: \"${SNOWFLAKE_WAREHOUSE}\""
            echo "      database: \"${SNOWFLAKE_DATABASE}\""
            echo "      schema: DBT_CI_TESTS"
            echo "      threads: 4"
          } > integration_tests/profiles.yml

      - name: Install dbt packages
        working-directory: integration_tests
        run: dbt deps

      - name: Run dbt build (models + tests)
        working-directory: integration_tests
        run: dbt build
