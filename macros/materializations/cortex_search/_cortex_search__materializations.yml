version: 2

macros:
  - name: cortex_search
    description: >
      Custom materialization that creates and manages Snowflake Cortex Search Services.
      Supports two forms: Form 1 (ON search_column) and Form 2 (TEXT INDEXES / VECTOR INDEXES).
      The model's SQL body is always used as the AS query for the service.
    docs:
      show: true
    arguments:
      - name: search_column
        type: string
        description: >
          Column to build the full-text search index on (Form 1). Mutually exclusive
          with text_indexes.
      - name: text_indexes
        type: list
        description: >
          List of text column names to index (Form 2). Mutually exclusive with search_column.
      - name: vector_indexes
        type: list
        description: Optional list of vector column specifications to index (Form 2 only).
      - name: primary_key
        type: list
        description: Optional primary key column(s) for the search service.
      - name: attributes
        type: list
        description: Additional columns for filtering and retrieval.
      - name: warehouse
        type: string
        description: Warehouse used to refresh the search index. Required.
      - name: target_lag
        type: string
        description: "Refresh frequency, e.g. '1 day'. Required."
      - name: embedding_model
        type: string
        description: Optional embedding model name (Form 1 only).
      - name: refresh_mode
        type: string
        description: "Optional refresh mode: FULL or INCREMENTAL."
      - name: initialize
        type: string
        description: "Optional initialization mode: ON_CREATE or ON_SCHEDULE."
      - name: full_index_build_interval_days
        type: integer
        description: Optional interval in days for full index rebuilds.
      - name: comment
        type: string
        description: Optional comment for the search service.
      - name: create_or_replace
        type: boolean
        description: >
          When true, uses CREATE OR REPLACE. When false (default), uses
          CREATE IF NOT EXISTS for new services and ALTER for existing ones.
