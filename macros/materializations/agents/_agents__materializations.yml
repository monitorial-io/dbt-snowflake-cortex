version: 2

macros:
  - name: agent
    description: >
      Custom materialization that creates and manages Snowflake Cortex Agents.
      Uses the model's SQL body (or the `specification` config) as the agent's
      YAML specification. Supports create-or-replace and incremental alter workflows.
    docs:
      show: true
    arguments:
      - name: specification
        type: string
        description: >
          YAML specification for the agent. If not provided, the model's SQL body
          is used as the specification.
      - name: comment
        type: string
        description: Optional comment for the agent.
      - name: profile
        type: string
        description: Optional profile for the agent.
      - name: create_or_replace
        type: boolean
        description: >
          When true, uses CREATE OR REPLACE AGENT. When false (default), uses
          CREATE AGENT IF NOT EXISTS for new agents and ALTER for existing ones.
      - name: append_environment_to_comment
        type: boolean
        description: >
          When true (default), appends the target environment name in brackets
          to the comment for non-prod targets.
