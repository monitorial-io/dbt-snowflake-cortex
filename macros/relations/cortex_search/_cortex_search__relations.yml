version: 2

macros:
  - name: snowflake__create_replace_or_alter_cortex_search
    description: >
      Orchestrator macro for the cortex_search materialization. Reads all config
      parameters, validates mutual exclusivity of Form 1 (ON search_column) vs
      Form 2 (TEXT INDEXES), and delegates to the appropriate DDL-generation macros.
      The model's SQL body is always used as the AS query.
    docs:
      show: true

  - name: snowflake__get_create_cortex_search_sql
    description: >
      Generates DDL for CREATE CORTEX SEARCH SERVICE using Form 1 (ON search_column).
      Supports primary_key, attributes, warehouse, target_lag, embedding_model,
      refresh_mode, initialize, full_index_build_interval_days, and comment.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target relation for the cortex search service.
      - name: create_statement
        type: string
        description: >
          The CREATE clause, e.g. "create or replace cortex search service"
          or "create cortex search service if not exists".
      - name: search_column
        type: string
        description: Column to build the full-text search index on.
      - name: primary_key
        type: list
        description: Optional primary key column(s).
      - name: attributes
        type: list
        description: Additional columns for filtering/retrieval.
      - name: warehouse
        type: string
        description: Warehouse used to refresh the search index.
      - name: target_lag
        type: string
        description: "Refresh frequency, e.g. '1 day'."
      - name: embedding_model
        type: string
        description: Optional embedding model name.
      - name: refresh_mode
        type: string
        description: "Optional: FULL or INCREMENTAL."
      - name: initialize
        type: string
        description: "Optional: ON_CREATE or ON_SCHEDULE."
      - name: full_index_build_interval_days
        type: integer
        description: Optional interval in days for full index rebuilds.
      - name: comment
        type: string
        description: Optional comment.
      - name: query
        type: string
        description: The AS query (source data SELECT statement).

  - name: snowflake__get_create_cortex_search_indexes_sql
    description: >
      Generates DDL for CREATE CORTEX SEARCH SERVICE using Form 2
      (TEXT INDEXES / VECTOR INDEXES). Does not support IF NOT EXISTS.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target relation for the cortex search service.
      - name: create_statement
        type: string
        description: The CREATE clause.
      - name: text_indexes
        type: list
        description: Text column names to index.
      - name: vector_indexes
        type: list
        description: Optional vector column specifications to index.
      - name: primary_key
        type: list
        description: Optional primary key column(s).
      - name: attributes
        type: list
        description: Additional columns for filtering/retrieval.
      - name: warehouse
        type: string
        description: Warehouse used to refresh the search index.
      - name: target_lag
        type: string
        description: "Refresh frequency, e.g. '1 day'."
      - name: refresh_mode
        type: string
        description: "Optional: FULL or INCREMENTAL."
      - name: initialize
        type: string
        description: "Optional: ON_CREATE or ON_SCHEDULE."
      - name: full_index_build_interval_days
        type: integer
        description: Optional interval in days for full index rebuilds.
      - name: comment
        type: string
        description: Optional comment.
      - name: query
        type: string
        description: The AS query (source data SELECT statement).

  - name: snowflake__get_alter_cortex_search_set_sql
    description: >
      Generates ALTER CORTEX SEARCH SERVICE SET DDL to update warehouse,
      target_lag, primary_key, full_index_build_interval_days, or comment.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target cortex search service relation.
      - name: warehouse
        type: string
        description: Optional new warehouse.
      - name: target_lag
        type: string
        description: Optional new target lag.
      - name: primary_key
        type: list
        description: Optional new primary key column(s).
      - name: full_index_build_interval_days
        type: integer
        description: Optional new full index rebuild interval.
      - name: comment
        type: string
        description: Optional new comment.

  - name: snowflake__get_alter_cortex_search_suspend_resume_sql
    description: >
      Generates ALTER CORTEX SEARCH SERVICE SUSPEND/RESUME DDL with optional
      INDEXING or SERVING scope.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target cortex search service relation.
      - name: action
        type: string
        description: "Either 'SUSPEND' or 'RESUME'."
      - name: scope
        type: string
        description: "Optional scope: 'INDEXING' or 'SERVING'."

  - name: snowflake__get_alter_cortex_search_refresh_sql
    description: Generates ALTER CORTEX SEARCH SERVICE REFRESH DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target cortex search service relation.

  - name: snowflake__get_alter_cortex_search_unset_sql
    description: Generates ALTER CORTEX SEARCH SERVICE UNSET PRIMARY KEY DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target cortex search service relation.
      - name: unset_primary_key
        type: boolean
        description: When true, unsets the primary key.

  - name: snowflake__get_alter_cortex_search_add_scoring_profile_sql
    description: Generates ALTER CORTEX SEARCH SERVICE ADD SCORING PROFILE DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target cortex search service relation.
      - name: profile_name
        type: string
        description: Name of the scoring profile to add.
      - name: scoring_profile
        type: string
        description: The scoring profile definition.
      - name: if_not_exists
        type: boolean
        description: When true, adds IF NOT EXISTS clause.

  - name: snowflake__get_alter_cortex_search_drop_scoring_profile_sql
    description: Generates ALTER CORTEX SEARCH SERVICE DROP SCORING PROFILE DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target cortex search service relation.
      - name: profile_name
        type: string
        description: Name of the scoring profile to drop.
      - name: if_exists
        type: boolean
        description: When true, adds IF EXISTS clause.

  - name: snowflake__get_drop_cortex_search_sql
    description: Generates DROP CORTEX SEARCH SERVICE IF EXISTS DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The cortex search service relation to drop.

  - name: snowflake__get_rename_cortex_search_sql
    description: Generates ALTER CORTEX SEARCH SERVICE IF EXISTS ... RENAME TO DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The current cortex search service relation.
      - name: new_name
        type: string
        description: The new name for the cortex search service.
