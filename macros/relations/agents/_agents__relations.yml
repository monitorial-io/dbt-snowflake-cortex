version: 2

macros:
  - name: snowflake__create_replace_or_alter_agent
    description: >
      Orchestrator macro for the agent materialization. Reads config values
      (comment, profile, specification, create_or_replace, append_environment_to_comment),
      determines whether to create or alter, and delegates to the appropriate
      DDL-generation macros. Falls back to the model's SQL body as the specification.
    docs:
      show: true

  - name: snowflake__get_create_agent_sql
    description: >
      Generates DDL to create a Snowflake Cortex Agent with a given YAML specification.
      Produces CREATE [OR REPLACE] AGENT ... FROM SPECIFICATION $$ ... $$.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target relation for the agent.
      - name: create_statement
        type: string
        description: >
          The CREATE clause, e.g. "create or replace agent" or
          "create agent if not exists".
      - name: comment
        type: string
        description: Optional comment for the agent.
      - name: profile
        type: string
        description: Optional profile for the agent.
      - name: specification
        type: string
        description: YAML specification for the agent.

  - name: snowflake__get_alter_agent_comment_and_profile_sql
    description: >
      Generates ALTER AGENT SET COMMENT/PROFILE DDL to update the comment
      and/or profile on an existing agent.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target agent relation.
      - name: comment
        type: string
        description: New comment value.
      - name: profile
        type: string
        description: New profile value.

  - name: snowflake__get_alter_agent_specification_sql
    description: >
      Generates ALTER AGENT MODIFY LIVE VERSION SET SPECIFICATION DDL to update
      the specification of an existing agent's live version.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The target agent relation.
      - name: specification
        type: string
        description: Updated YAML specification for the agent.

  - name: snowflake__get_drop_agent_sql
    description: Generates DROP AGENT IF EXISTS DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The agent relation to drop.

  - name: snowflake__get_rename_agent_sql
    description: Generates ALTER AGENT IF EXISTS ... RENAME TO DDL.
    docs:
      show: true
    arguments:
      - name: relation
        type: relation
        description: The current agent relation.
      - name: new_name
        type: string
        description: The new name for the agent.
